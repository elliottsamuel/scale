<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Currents — Currents, Circles, and Drops from the Mystic Method. Your data, your device.">
<meta name="theme-color" content="#0a1620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<title>Currents</title>
</head>
<body>
<style>
  /*
   * A deliberately single, dark world — deep water at night, with light
   * glowing up through it. Not meant to adapt to a light host theme; every
   * color below is explicit so the page holds its own ground regardless.
   */
  :root{
    --deep:#0a1620;
    --dusk:#101f2c;
    --surge:#17303e;
    --surge2:#1d3947;
    --line:rgba(147,174,178,.16);
    --line-strong:rgba(147,174,178,.28);
    --foam:#eef5f2;
    --tide:#93aeb2;
    --tide-dim:#5f7679;
    --danger:#e8836a;
    --kelp:#7fd8c4;
    --kelp-ink:#052420;
    --ember:#e2996a;
    --radius:20px;
    --radius-sm:13px;
    --maxw:480px;
    --font-display:"Fraunces",Georgia,"Iowan Old Style",serif;
    --font-body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

    --self:#9098e6;
    --ohana:#ec8aa8;
    --collective:#5cc3d6;
    --afterglow:#e0b563;
    --kumara:var(--kelp);
  }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--deep)}
  body{
    font-family:var(--font-body);color:var(--foam);line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;
    background:
      radial-gradient(620px 420px at 12% -8%, rgba(127,216,196,.07), transparent 60%),
      radial-gradient(520px 420px at 102% 0%, rgba(144,152,230,.05), transparent 55%),
      var(--deep);
    background-attachment:fixed;
  }
  button,input,textarea,select{font-family:inherit}
  a{color:inherit}
  ::selection{background:var(--kelp);color:var(--kelp-ink)}
  h1,h2{text-wrap:balance}

  .app{max-width:var(--maxw);margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 26px) calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 128px) calc(env(safe-area-inset-left) + 24px);}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:18px}
  .topbar .mark{color:var(--kelp);flex:0 0 auto;display:flex}
  .brand{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:20px;color:var(--foam)}

  main{flex:1;display:flex;flex-direction:column}
  .screen{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .screen{animation:none} *{scroll-behavior:auto !important} }

  .screen-head{margin:4px 0 26px}
  .screen-head h1{font-family:var(--font-display);font-weight:600;font-size:29px;margin:0 0 5px}
  .screen-head .sub{color:var(--tide);font-size:14px;margin:0}

  .tabhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:4px 0 26px}
  .tabhead h1{font-family:var(--font-display);font-weight:600;font-size:29px;margin:0 0 5px}

  .circle-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:36px 0 16px;padding-left:2px}
  .circle-heading:first-of-type{margin-top:0}
  .circle-heading .name{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;
    color:var(--accent, var(--tide))}
  .group-heading{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    color:var(--tide-dim);margin:30px 0 13px;padding-left:2px}
  .group-heading:first-of-type{margin-top:0}

  /* ---------- buttons ---------- */
  .addbtn{-webkit-appearance:none;appearance:none;border:1px solid var(--line-strong);background:var(--surge);
    color:var(--foam);padding:11px 17px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .12s ease}
  .addbtn:active{transform:scale(.96)}
  .addbtn.small{padding:6px 12px;font-size:12.5px}

  /* ---------- card ---------- */
  .card{--accent:var(--kelp);background:linear-gradient(175deg, var(--surge2), var(--surge) 55%, var(--dusk));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 26px 0;margin-bottom:26px;position:relative;overflow:hidden;
    box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
  .card::before{content:"";position:absolute;top:-70px;left:-60px;width:200px;height:200px;border-radius:50%;
    background:var(--accent);opacity:.16;filter:blur(6px);pointer-events:none}
  .card .num{width:38px;height:38px;border-radius:50%;background:var(--deep);color:var(--accent);
    border:1px solid var(--accent);box-shadow:0 0 20px -5px var(--accent);
    display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:15px;
    margin-bottom:16px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
  .card .editbtn{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;z-index:1;
    border:1px solid var(--line);background:rgba(10,22,32,.5);color:var(--tide);display:grid;
    place-items:center;cursor:pointer;font-size:14px;-webkit-appearance:none;appearance:none}
  .card .editbtn:active{transform:scale(.92)}
  .card h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 44px 10px 0;line-height:1.35;
    position:relative;z-index:1}
  .card .desc{color:var(--tide);font-size:14.5px;line-height:1.6;margin:0 0 4px;position:relative;z-index:1}

  .cell{background:rgba(10,22,32,.35);margin:0 -26px;padding:16px 26px;border-top:1px solid var(--line);
    position:relative;z-index:1}
  .cell:last-child{border-radius:0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px)}
  .cell .label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--tide-dim);
    text-transform:uppercase;margin-bottom:6px}
  .cell .body{font-size:14.5px;color:var(--tide);line-height:1.55;white-space:pre-wrap}
  .cell.kumara{background:linear-gradient(120deg, rgba(127,216,196,.12), rgba(10,22,32,.35) 70%)}
  .cell.kumara .label{color:var(--kelp)}
  .cell.kumara .body{font-family:var(--font-display);font-style:italic;color:var(--foam)}
  .cell.aramuk{background:linear-gradient(120deg, rgba(226,153,106,.10), rgba(10,22,32,.35) 70%)}
  .cell.aramuk .label{color:var(--ember)}
  .cell.aramuk .body{font-family:var(--font-display);font-style:italic;color:var(--foam)}

  .rows{margin:0 -26px;position:relative;z-index:1}
  .row{display:flex;align-items:center;gap:14px;padding:16px 26px;border-top:1px solid var(--line);
    cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;color:inherit}
  .row:active{background:rgba(255,255,255,.03)}
  .row.disabled{cursor:default;opacity:.45}
  .row .n{width:18px;flex:0 0 auto;font-family:var(--font-mono);font-weight:600;font-size:14px;
    color:var(--accent,var(--tide));font-variant-numeric:tabular-nums}
  .row .dot{width:7px;height:7px;border-radius:50%;background:var(--tide-dim);flex:0 0 auto}
  .row .t{flex:1;font-size:15px;font-weight:600;color:var(--foam);min-width:0}
  .row .t.placeholder{color:var(--tide-dim);font-weight:500}
  .row.done .t{color:var(--tide-dim);text-decoration:line-through}
  .row .meta{font-family:var(--font-mono);font-size:12px;color:var(--tide-dim);white-space:nowrap;flex:0 0 auto;
    max-width:38%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .row .chev{color:var(--tide-dim);font-size:15px;flex:0 0 auto}

  .rows.card-like{background:var(--surge);border:1px solid var(--line);border-radius:var(--radius);
    margin:0 0 8px;overflow:hidden}
  .rows.card-like .row:first-child{border-top:none}

  .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);flex:0 0 auto;
    display:grid;place-items:center;cursor:pointer;font-size:14px;font-weight:800;color:transparent;
    -webkit-appearance:none;appearance:none;background:none;padding:0}
  .check.done{background:var(--kelp);border-color:var(--kelp);color:var(--kelp-ink)}

  /* ---------- states ---------- */
  .empty-block{padding:26px 4px 30px;color:var(--tide-dim);font-size:14px;line-height:1.65}
  .empty-block b{display:block;font-family:var(--font-display);font-weight:600;color:var(--foam);
    font-size:16px;margin-bottom:6px}

  .welcome{padding-top:22px}
  .welcome h1{font-family:var(--font-display);font-weight:600;font-size:28px;margin:0 0 14px}
  .welcome p{color:var(--tide);line-height:1.65;font-size:14.5px;margin:0 0 12px}
  .welcome p b{color:var(--foam);font-weight:700}

  .onboard-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 24px}
  .onboard-skip{font-size:13px;font-weight:700;color:var(--tide);background:rgba(10,22,32,.4);
    border:1px solid var(--line);border-radius:999px;cursor:pointer;padding:9px 16px;
    -webkit-appearance:none;appearance:none}
  .onboard-skip:active{transform:scale(.96)}
  .onboard-progress{display:flex;gap:6px;margin:0 0 28px}
  .onboard-progress .dot{flex:1;height:3px;border-radius:2px;background:var(--line)}
  .onboard-progress .dot.done{background:var(--kelp)}
  .onboard-error{color:var(--danger);font-size:13px;margin:-4px 0 14px}

  /* ---------- intro carousel ---------- */
  .intro-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none;margin:0 -24px}
  .intro-track::-webkit-scrollbar{display:none}
  .intro-frame{flex:0 0 100%;scroll-snap-align:start;padding:8px 24px 0;display:flex;flex-direction:column}
  .intro-frame h1{font-family:var(--font-display);font-weight:600;font-size:27px;margin:0 0 12px}
  .intro-frame p{color:var(--tide);line-height:1.65;font-size:14.5px;margin:0}
  .intro-visual{width:88px;height:88px;border-radius:50%;background:var(--deep);border:1px solid var(--line);
    color:var(--kelp);display:grid;place-items:center;margin-bottom:26px;box-shadow:0 0 44px -10px var(--kelp)}
  .intro-visual svg{width:40px;height:40px}
  .intro-preview{background:rgba(10,22,32,.4);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;margin-bottom:26px}
  .intro-preview .mini-cell{border-radius:12px;padding:12px 15px;margin-bottom:8px}
  .intro-preview .mini-cell:last-child{margin-bottom:0}
  .intro-preview .mini-cell .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .intro-preview .mini-cell.kumara{background:linear-gradient(120deg, rgba(127,216,196,.14), transparent)}
  .intro-preview .mini-cell.kumara .lbl{color:var(--kelp)}
  .intro-preview .mini-cell.aramuk{background:linear-gradient(120deg, rgba(226,153,106,.12), transparent)}
  .intro-preview .mini-cell.aramuk .lbl{color:var(--ember)}
  .intro-preview .mini-cell .txt{font-family:var(--font-display);font-style:italic;font-size:14.5px;color:var(--foam)}
  .intro-preview .mini-row{display:flex;align-items:center;gap:13px;padding:10px 2px;border-top:1px solid var(--line)}
  .intro-preview .mini-row:first-child{border-top:none}
  .intro-preview .mini-row .n{font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--kelp);width:16px;flex:0 0 auto}
  .intro-preview .mini-row .t{font-size:14px;font-weight:600;color:var(--foam)}
  .intro-dots{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
  .intro-dots .dot{width:7px;height:7px;border-radius:4px;background:var(--line-strong);border:0;padding:0;
    cursor:pointer;-webkit-appearance:none;appearance:none;transition:width .2s ease,background .2s ease}
  .intro-dots .dot.active{background:var(--kelp);width:22px}

  .intro-visual.big{width:140px;height:140px;margin-bottom:24px}
  .intro-visual.big svg{width:60px;height:60px}
  .intro-visual.pulse{animation:pulse-glow 3.2s ease-in-out infinite}
  @keyframes pulse-glow{0%,100%{transform:scale(1);box-shadow:0 0 44px -10px var(--kelp)}
    50%{transform:scale(1.05);box-shadow:0 0 60px -8px var(--kelp)}}
  @media (prefers-reduced-motion: reduce){ .intro-visual.pulse{animation:none} }
  .intro-lead{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--foam);
    line-height:1.45;margin:0 0 10px}

  .player{display:flex;align-items:center;gap:14px;background:rgba(10,22,32,.4);border:1px solid var(--line);
    border-radius:18px;padding:12px 16px;margin-top:22px}
  .player-play{width:52px;height:52px;border-radius:50%;background:var(--kelp);color:var(--kelp-ink);
    border:0;display:grid;place-items:center;flex:0 0 auto;cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(127,216,196,.55);-webkit-appearance:none;appearance:none}
  .player-play:active{transform:scale(.94)}
  .player-play svg{width:20px;height:20px}
  .player-viz{flex:1;display:flex;align-items:center;gap:4px;height:28px;min-width:0}
  .player-viz .bar{flex:1;background:var(--tide-dim);border-radius:3px;height:22%;opacity:.7;
    transition:background .2s ease}
  .player-viz.playing .bar{background:var(--kelp);opacity:1;animation:barbounce 1.1s ease-in-out infinite}
  .player-viz .bar:nth-child(1){animation-duration:.9s}
  .player-viz .bar:nth-child(2){animation-duration:1.3s;animation-delay:.1s}
  .player-viz .bar:nth-child(3){animation-duration:1s;animation-delay:.2s}
  .player-viz .bar:nth-child(4){animation-duration:1.4s;animation-delay:0s}
  .player-viz .bar:nth-child(5){animation-duration:1.05s;animation-delay:.25s}
  .player-viz .bar:nth-child(6){animation-duration:1.2s;animation-delay:.15s}
  .player-viz .bar:nth-child(7){animation-duration:.95s;animation-delay:.3s}
  @keyframes barbounce{0%,100%{height:22%}50%{height:95%}}
  @media (prefers-reduced-motion: reduce){ .player-viz.playing .bar{animation:none;height:70%} }
  .player-time{font-family:var(--font-mono);font-size:11px;color:var(--tide-dim);flex:0 0 auto;
    font-variant-numeric:tabular-nums}
  .player-note{font-size:12px;color:var(--ember);margin-top:10px;min-height:15px}

  /* ---------- bottom nav ---------- */
  .bottomnav{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    width:calc(100% - 44px);max-width:calc(var(--maxw) - 44px);
    display:flex;background:rgba(16,31,44,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line-strong);border-radius:20px;padding:8px;
    box-shadow:0 16px 36px -14px rgba(0,0,0,.65)}
  .navbtn{flex:1;-webkit-appearance:none;appearance:none;border:0;background:none;color:var(--tide-dim);
    display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 9px;cursor:pointer;font-size:11px;
    font-weight:700;position:relative;border-radius:14px;transition:color .15s ease}
  .navbtn .ic{width:20px;height:20px;display:flex}
  .navbtn .ic svg{width:100%;height:100%}
  .navbtn[aria-current="true"]{color:var(--foam)}
  .navbtn[aria-current="true"] .ic{color:var(--kelp)}
  .navbtn[aria-current="true"]::after{content:"";position:absolute;top:1px;width:4px;height:4px;
    border-radius:50%;background:var(--kelp)}

  /* ---------- bottom sheets ---------- */
  #sheets{position:fixed;inset:0;z-index:200;display:none}
  .backdrop{position:absolute;inset:0;background:rgba(3,10,15,.7)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;
    background:linear-gradient(175deg, var(--surge2), var(--dusk) 60%);
    border:1px solid var(--line-strong);border-bottom:none;border-radius:24px 24px 0 0;
    max-height:88vh;overflow-y:auto;padding:14px 24px calc(30px + env(safe-area-inset-bottom));
    transition:transform .18s ease, opacity .18s ease;box-shadow:0 -20px 50px -20px rgba(0,0,0,.7)}
  .sheet-peek{height:16px;padding:0;pointer-events:none;box-shadow:none}
  .sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 16px}
  .sheet-head{display:flex;align-items:flex-start;gap:12px;padding-bottom:16px;margin-bottom:18px;
    border-bottom:1px solid var(--line)}
  .sheet-titles{flex:1;min-width:0}
  .sheet-title{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.35}
  .sheet-sub{font-size:13.5px;color:var(--tide-dim);margin-top:4px}
  .sheet-back,.sheet-close{-webkit-appearance:none;appearance:none;border:0;background:var(--surge);
    color:var(--tide);width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;
    flex:0 0 auto;display:grid;place-items:center}
  .sheet-back.spacer{visibility:hidden}
  .sheet-body .desc{color:var(--tide);font-size:14.5px;line-height:1.6;margin:0 0 18px}
  .drop-count{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--tide-dim);margin:2px 0 12px}
  .facts{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
  .fact{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:12px 15px;
    background:rgba(10,22,32,.4);border-radius:11px;border:1px solid var(--line)}
  .fact span{color:var(--tide-dim)}
  .fact b{font-weight:700;text-align:right}

  /* ---------- forms ---------- */
  .field{margin-bottom:18px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--tide-dim);margin-bottom:8px}
  .field input,.field textarea,.field select{width:100%;background:rgba(10,22,32,.5);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;color:var(--foam);font-size:15px;font-family:inherit}
  .field input::placeholder,.field textarea::placeholder{color:var(--tide-dim)}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--kelp);outline-offset:1px}
  .field textarea{min-height:70px;resize:vertical;line-height:1.55}
  .formrow{display:flex;gap:12px}
  .formrow .field{flex:1;min-width:0}
  .chiprow{display:flex;flex-wrap:wrap;gap:9px}
  .chip{-webkit-appearance:none;appearance:none;border:1px solid var(--line-strong);background:rgba(10,22,32,.4);
    color:var(--tide);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;
    transition:transform .1s ease}
  .chip[data-selected="true"]{background:var(--chip-accent,var(--kelp));border-color:var(--chip-accent,var(--kelp));
    color:var(--kelp-ink)}
  .formactions{display:flex;gap:12px;margin-top:26px}
  .btn{-webkit-appearance:none;appearance:none;border:0;border-radius:13px;padding:14px;font-weight:700;
    font-size:14.5px;cursor:pointer;flex:1;text-align:center;transition:transform .1s ease}
  .btn.primary{background:var(--kelp);color:var(--kelp-ink);box-shadow:0 10px 24px -8px rgba(127,216,196,.5)}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);flex:0 0 auto;padding:14px 18px}
  .btn:active{transform:scale(.98)}
</style>

<div class="app">
  <header class="topbar">
    <span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 9c2 0 2-3 4-3s2 3 4 3 2-3 4-3 2 3 4 3 2-3 4-3"/><path d="M2 15c2 0 2-3 4-3s2 3 4 3 2-3 4-3 2 3 4 3 2-3 4-3" opacity=".5"/></svg></span>
    <span class="brand">Currents</span>
  </header>
  <main id="main"></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="sheets"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "currents-app-v1";
  var STEP_LABELS = ["Clarify your destination","Visualize the path","Feel the transformation","Follow your strategy","Be yourself"];
  var CIRCLE_DEFS = [
    { key:"self", label:"Self", desc:"Healing, growth, becoming who you're meant to be." },
    { key:"ohana", label:"Ohana", desc:"Family, close friends, the people nearest to you." },
    { key:"collective", label:"Collective", desc:"Your work in the world — clients, community, impact." },
    { key:"afterglow", label:"After Glow", desc:"The legacy you leave — what outlasts you." },

  var ICON_DROP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3c3.5 4.5 6 7.9 6 10.8A6 6 0 1 1 6 13.8C6 10.9 8.5 7.5 12 3z"/></svg>';

  // Paste a direct-playable link here (Dropbox share links need converting —

  function normalizeTrackUrl(url){
    if(!url) return url;
    if(url.indexOf("dropbox.com") !== -1){
      if(/[?&]dl=0\b/.test(url)) return url.replace(/([?&])dl=0\b/, "$1dl=1");

  var TABS = [

  var state = { tab:"currents" };

  function esc(v){

  // ---------- tabs ----------

  function dropRowHTML(d){

  // ---------- sheets ----------
  function sheetShell(title, subtitle, bodyHTML, opts){

  function renderSheets(){
    if(!sheetStack.length){ sheetsRoot.innerHTML = ""; sheetsRoot.style.display = "none"; return; }
    sheetsRoot.style.display = "block";
    var n = sheetStack.length;
    var html = '<div class="backdrop" id="backdrop"></div>';
    for(var i = 0; i < n; i++){
      if(i === n - 1){
        html += '<div class="sheet">' + sheetStack[i].html + "</div>";
      } else {
        html += '<div class="sheet sheet-peek" style="bottom:' + ((n - 1 - i) * 10) + 'px"></div>';
      }
    }
    sheetsRoot.innerHTML = html;
    document.getElementById("backdrop").onclick = closeSheets;
  }
  function pushSheet(html, refresh){ sheetStack.push({ html:html, refresh:refresh || null }); renderSheets(); }
  function replaceTopSheet(html){ if(sheetStack.length){ sheetStack[sheetStack.length-1].html = html; renderSheets(); } }
  function popSheet(){ sheetStack.pop(); renderSheets(); }
  function closeSheets(){ sheetStack = []; renderSheets(); }
  // Pop the current (e.g. a form) sheet and, if that reveals another sheet
  // underneath (e.g. the step sheet a "+ Add Drop" form was opened from),
  // refresh its content so it reflects what was just saved/deleted.
  function popAndRefresh(){
    popSheet();
    if(sheetStack.length && sheetStack[sheetStack.length-1].refresh){ sheetStack[sheetStack.length-1].refresh(); }
  }

  // ---------- step sheet (drops for a current x step) ----------

    }
    body += '<div class="drop-count">' + drops.length + " drop" + (drops.length === 1 ? "" : "s") + "</div>";
    if(drops.length){
      body += '<div class="rows">' + drops.map(function(d){
        return '<div class="row' + (d.completed ? " done" : "") + '" data-drop="' + escAttr(d.id) + '">' +

  // ---------- headphones track player (intro, frame 1) ----------
  var audioEl = null;
  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) return "0:00";
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function updatePlayerTime(){
    var el = document.getElementById("playerTime");
    if(!el || !audioEl) return;
    el.textContent = fmtTime(audioEl.currentTime) + " / " + fmtTime(audioEl.duration || 0);
  }
  function setPlayerPlaying(playing){
    var btn = document.getElementById("playerPlayBtn");
    var viz = document.getElementById("playerViz");
    if(btn){ btn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; btn.setAttribute("aria-label", playing ? "Pause" : "Play"); }
    if(viz) viz.classList.toggle("playing", playing);
  }
  function ensureAudio(){
    if(audioEl) return audioEl;
    audioEl = new Audio(normalizeTrackUrl(TRACK_URL));
    audioEl.addEventListener("timeupdate", updatePlayerTime);
    audioEl.addEventListener("loadedmetadata", updatePlayerTime);
    audioEl.addEventListener("ended", function(){ setPlayerPlaying(false); });
    audioEl.addEventListener("error", function(){
      var note = document.getElementById("playerNote");
      if(note) note.textContent = "Couldn't load the track — check the link.";
      setPlayerPlaying(false);
    });
    return audioEl;
  }
  function toggleTrack(){
    var note = document.getElementById("playerNote");
    if(!TRACK_URL){ if(note) note.textContent = "Track isn't set up yet."; return; }
    if(note) note.textContent = "";
    var a = ensureAudio();
    if(a.paused){ a.play().catch(function(){ if(note) note.textContent = "Couldn't play the track — check the link."; }); setPlayerPlaying(true); }
    else { a.pause(); setPlayerPlaying(false); }
  }

  // ---------- intro carousel (first run only) ----------
  // NOTE: this ships with an empty STATE and no seed/example/personal data —
  // keep it that way. The only way data ever gets created is by someone
  // actually going through the New Current flow or the Drop form themselves.
  var intro = { frame:0 };
  var INTRO_FRAMES = [
    {
      html: '<div class="intro-visual big pulse">' + ICON_WAVE + "</div>" +
        '<p class="intro-lead">Currents is a productivity app designed to help you become the biggest version of yourself.</p>' +
        "<p>To learn what that feels like, put on some headphones and press play.</p>" +
        '<div class="player">' +
        '<button type="button" class="player-play" id="playerPlayBtn" data-action="track-toggle" aria-label="Play">' + ICON_PLAY + "</button>" +
        '<div class="player-viz" id="playerViz">' + new Array(7).fill('<span class="bar"></span>').join("") + "</div>" +
        '<span class="player-time" id="playerTime">0:00</span>' +
        "</div>" +
        '<div class="player-note" id="playerNote"></div>'
    },
    {
      visual: '<div class="intro-preview">' +
        '<div class="mini-cell kumara"><div class="lbl">Kumara</div><div class="txt">Proud, at ease, unstoppable.</div></div>' +
        '<div class="mini-cell aramuk"><div class="lbl">Aramuk</div><div class="txt">Afraid I\'ll quit again.</div></div>' +
        "</div>",
      title: "Every goal has two feelings",
      body: "Name the feeling you want on the other side, and the one that's been in the way. That's what actually pulls you forward."
    },
    {
      visual: '<div class="intro-preview">' + STEP_LABELS.map(function(label, i){
        return '<div class="mini-row"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(label) + "</span></div>";
      }).join("") + "</div>",
      title: "Five steps, one current",
      body: "Every goal moves through the same five steps from the Mystic Method — and every action you take files under one of them."
    }
  ];

  function introFrameHTML(f){
    if(f.html) return '<div class="intro-frame">' + f.html + "</div>";
    return '<div class="intro-frame">' + f.visual + "<h1>" + esc(f.title) + "</h1><p>" + esc(f.body) + "</p></div>";
  }
  function renderIntro(){
    bottomnav.style.display = "none";
    intro.frame = 0;
    var dots = INTRO_FRAMES.map(function(f, i){
      return '<button type="button" class="dot' + (i === 0 ? " active" : "") + '" data-action="intro-goto" data-idx="' + i + '"></button>';
    }).join("");
    main.innerHTML = '<div class="screen welcome">' +
      '<div class="onboard-head"><span></span><button class="onboard-skip" data-action="intro-skip">Skip</button></div>' +
      '<div class="intro-track" id="introTrack">' + INTRO_FRAMES.map(introFrameHTML).join("") + "</div>" +
      '<div class="intro-dots" id="introDots">' + dots + "</div>" +
      '<div class="formactions"><button class="btn primary" id="introCta" data-action="intro-next">Next</button></div>' +
      "</div>";
    var track = document.getElementById("introTrack");
    var ticking = false;
    track.addEventListener("scroll", function(){
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(function(){
        setIntroFrame(Math.round(track.scrollLeft / track.clientWidth));
        ticking = false;
      });
    });
  }
  function setIntroFrame(idx){
    intro.frame = idx;
    Array.prototype.forEach.call(document.querySelectorAll("#introDots .dot"), function(d, i){
      d.classList.toggle("active", i === idx);
    });
    var cta = document.getElementById("introCta");
    if(!cta) return;
    if(idx >= INTRO_FRAMES.length - 1){
      cta.textContent = "Add My First Current";
      cta.setAttribute("data-action", "intro-finish");
    } else {
      cta.textContent = "Next";
      cta.setAttribute("data-action", "intro-next");
    }
  }
  function introGoTo(idx){
    idx = Math.max(0, Math.min(INTRO_FRAMES.length - 1, idx));
    var track = document.getElementById("introTrack");
    track.scrollTo({ left: idx * track.clientWidth, behavior: "smooth" });
  }
  function introSkip(){ bottomnav.style.display = "flex"; switchTab("currents"); }

  // ---------- New Current flow ----------
  // The same guided flow whether it's someone's very first Current (reached
  // from the intro carousel) or a later one opened from a "+ New" button
  // anywhere in the app. Circle and Aramuk are deliberately not collected
  // here — they can be added afterward by editing the Current.
  var flow = null;

  function openCurrentFlow(defaultCircle){
    flow = { step:1, defaultCircle: defaultCircle || null, draft:{ name:"", myA:"", myB:"", kumara:"" } };
    bottomnav.style.display = "none";
    renderCurrentFlow();
  }
  function closeCurrentFlow(){
    flow = null;
    bottomnav.style.display = "flex";
    switchTab(state.tab || "currents");
  }
  function flowHeadHTML(){
    return '<div class="onboard-head">' +
      (flow.step > 1 ? '<button class="onboard-skip" data-action="flow-back">‹ Back</button>' : "<span></span>") +
      '<button class="onboard-skip" data-action="flow-cancel">Cancel</button></div>';
  }
  function flowStepGoalHTML(){
    var d = flow.draft;
    return "<h1>What are you moving toward?</h1>" +
      "<p>Name a project or vision — big or small — that matters to you right now.</p>" +
      '<div class="field"><input id="cf-name" value="' + escAttr(d.name) + '" placeholder="Your most important goal right now"></div>' +
      '<div id="cf-error" class="onboard-error"></div>' +
      '<div class="formactions"><button class="btn primary" data-action="flow-next">Continue</button></div>';
  }
  function flowStepAHTML(){
    var name = flow.draft.name.trim() || "this goal";
    return "<h1>Where are you now?</h1>" +
      '<p>In regards to <b>' + esc(name) + "</b> — where are you right now? This is your <b>My A</b>.</p>" +
      '<div class="field"><textarea id="cf-mya" placeholder="Describe where things stand today">' + esc(flow.draft.myA) + "</textarea></div>" +
      '<div class="formactions"><button class="btn primary" data-action="flow-next">Continue</button></div>';
  }
  function flowStepBAndKumaraHTML(){
    var name = flow.draft.name.trim() || "this goal";
    return "<h1>Picture it finished</h1>" +
      '<p>What would it look like to have achieved <b>' + esc(name) + "</b>? How will you know? This is your <b>My B</b>.</p>" +
      '<div class="field"><textarea id="cf-myb" placeholder="Describe what it looks like when this is real">' + esc(flow.draft.myB) + "</textarea></div>" +
      "<p>How will you feel when this is complete? This is your <b>Kumara</b> — the feeling we'll anchor to and use to pull you toward it.</p>" +
      '<div class="field"><textarea id="cf-kumara" placeholder="e.g. Proud, at ease, unstoppable">' + esc(flow.draft.kumara) + "</textarea></div>" +
      '<div class="formactions"><button class="btn primary" data-action="flow-finish">Create Current</button></div>';
  }
  function renderCurrentFlow(){
    var progress = '<div class="onboard-progress">' + [1, 2, 3].map(function(n){
      return '<div class="dot' + (n <= flow.step ? " done" : "") + '"></div>';
    }).join("") + "</div>";
    var body = flow.step === 1 ? flowStepGoalHTML() : flow.step === 2 ? flowStepAHTML() : flowStepBAndKumaraHTML();
    main.innerHTML = '<div class="screen welcome">' + flowHeadHTML() + progress + body + "</div>";
  }
  function flowReadCurrentStep(){
    var d = flow.draft;
    if(flow.step === 1){ d.name = (document.getElementById("cf-name") || {}).value || ""; }
    else if(flow.step === 2){ d.myA = (document.getElementById("cf-mya") || {}).value || ""; }
    else if(flow.step === 3){
      d.myB = (document.getElementById("cf-myb") || {}).value || "";
      d.kumara = (document.getElementById("cf-kumara") || {}).value || "";
    }
  }
  function flowNext(){
    flowReadCurrentStep();
    if(flow.step === 1 && !flow.draft.name.trim()){
      var err = document.getElementById("cf-error");
      if(err) err.textContent = "Enter a goal to continue.";
      return;
    }
    flow.step++;
    renderCurrentFlow();
  }
  function flowBack(){ flow.step = Math.max(1, flow.step - 1); renderCurrentFlow(); }
  function flowFinish(){
    flowReadCurrentStep();
    var d = flow.draft;
    // Priority 1 only for someone's very first Current, so it shows up
    // immediately on the Currents tab instead of an empty state right after
    // finishing the flow. Later Currents default to no priority, same as
    // creating one any other way.
    var priority = STATE.currents.length === 0 ? 1 : null;
    STATE.currents.push({
      id:newId(), name:d.name.trim(), description:"", circle:flow.defaultCircle,
      priority:priority, kumara:d.kumara, aramuk:"", myA:d.myA, myB:d.myB
    });
    saveState();
    flow = null;
    bottomnav.style.display = "flex";
    switchTab("currents");
  }

  // ---------- wiring ----------
  function handleAction(target){
    var action = target.getAttribute("data-action");
    if(!action) return false;
    if(action === "close"){ closeSheets(); return true; }
    if(action === "back"){ popSheet(); return true; }
    if(action === "new-current"){ openCurrentFlow(target.getAttribute("data-circle")); return true; }
    if(action === "edit-current"){ openCurrentForm(target.getAttribute("data-id")); return true; }
    if(action === "save-current"){ saveCurrentForm(); return true; }
    if(action === "delete-current"){ deleteCurrentConfirm(target.getAttribute("data-id")); return true; }
    if(action === "new-drop"){ openDropForm(null, target.getAttribute("data-current"), parseInt(target.getAttribute("data-step"), 10) || null); return true; }
    if(action === "edit-drop"){ openDropForm(target.getAttribute("data-id")); return true; }
    if(action === "save-drop"){ saveDropForm(); return true; }
    if(action === "delete-drop"){ deleteDrop(target.getAttribute("data-id")); return true; }
    if(action === "toggle-drop"){ toggleDrop(target.getAttribute("data-id")); return true; }
    if(action === "intro-next"){ introGoTo(intro.frame + 1); return true; }
    if(action === "intro-goto"){ introGoTo(parseInt(target.getAttribute("data-idx"), 10)); return true; }
    if(action === "intro-skip"){ introSkip(); return true; }
    if(action === "intro-finish"){ openCurrentFlow(); return true; }
    if(action === "track-toggle"){ toggleTrack(); return true; }
    if(action === "flow-next"){ flowNext(); return true; }
    if(action === "flow-back"){ flowBack(); return true; }
    if(action === "flow-cancel"){ closeCurrentFlow(); return true; }
    if(action === "flow-finish"){ flowFinish(); return true; }
    return false;
  }

  function handleClick(e){
    var actionEl = e.target.closest("[data-action]");
    if(actionEl && handleAction(actionEl)) return;
    var chip = e.target.closest(".chip[data-field]");
    if(chip){
      var field = chip.getAttribute("data-field");
      var value = chip.getAttribute("data-value");
      var group = chip.parentElement;
      Array.prototype.forEach.call(group.querySelectorAll(".chip"), function(c){ c.setAttribute("data-selected", "false"); });
      chip.setAttribute("data-selected", "true");
      if(field === "circle"){ currentDraft.circle = value; }
      if(field === "step"){ dropDraft.step = value ? parseInt(value, 10) : null; }
      return;
    }
    var stepRow = e.target.closest(".row[data-step]");
    if(stepRow){ openStepSheet(stepRow.getAttribute("data-current"), parseInt(stepRow.getAttribute("data-step"), 10)); return; }
    var dropRow = e.target.closest(".row[data-drop]");
    if(dropRow){ openDropSheet(dropRow.getAttribute("data-drop")); return; }
  }

  function init(){
    main = document.getElementById("main");
    bottomnav = document.getElementById("bottomnav");
    sheetsRoot = document.getElementById("sheets");

    bottomnav.innerHTML = TABS.map(function(t){
      return '<button class="navbtn" data-tab="' + t.id + '" aria-current="' + (state.tab === t.id) + '">' +
        '<span class="ic">' + t.ic + '</span><span class="lb">' + t.lb + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(bottomnav.querySelectorAll(".navbtn"), function(b){
      b.onclick = function(){ switchTab(b.getAttribute("data-tab")); };
    });

    document.body.addEventListener("click", handleClick);

    if(STATE.currents.length || STATE.drops.length){
      switchTab("currents");
    } else {
      renderIntro();
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
