<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Currents — your Currents, Circles, and Drops from the Mystic Method, live from Notion.">
<meta name="theme-color" content="#0b0b0f">
<title>Currents</title>
</head>
<body>
<style>
  :root{
    --bg:#0b0b0f;
    --bg2:#111116;
    --surface:#16161d;
    --surface2:#1c1c25;
    --border:rgba(255,255,255,.09);
    --border-strong:rgba(255,255,255,.18);
    --ink:#f2f1ee;
    --ink-soft:#a7adba;
    --ink-faint:#6d7280;
    --danger:#e0716a;
    --radius:18px;
    --radius-sm:12px;
    --maxw:480px;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;

    --self:#8b7bd8;
    --ohana:#e8608f;
    --collective:#3fb6c9;
    --afterglow:#e0a84e;
    --kumara:#4fbf74;
  }

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{
    font-family:var(--font-body);color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  button,input,textarea{font-family:inherit}
  a{color:inherit}
  ::selection{background:var(--self);color:#fff}

  .app{max-width:var(--maxw);margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
  .brand{font-weight:800;font-size:19px;letter-spacing:.1px}
  .iconbtn{-webkit-appearance:none;appearance:none;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    font-size:16px;transition:transform .12s ease}
  .iconbtn:active{transform:scale(.92)}

  main{flex:1;display:flex;flex-direction:column}
  .screen{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .screen{animation:none} *{scroll-behavior:auto !important} }

  .screen-head{margin:8px 0 16px}
  .screen-head h1{font-size:26px;margin:0 0 2px;font-weight:800}
  .screen-head .sub{color:var(--ink-faint);font-size:14px;margin:0}

  .circle-heading{font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;
    color:var(--accent, var(--ink-faint));margin:22px 0 10px;padding-left:2px}
  .circle-heading:first-of-type{margin-top:0}
  .group-heading{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;
    color:var(--ink-faint);margin:20px 0 8px;padding-left:2px}
  .group-heading:first-of-type{margin-top:0}

  /* ---------- card ---------- */
  .card{--accent:var(--kumara);background:var(--surface);border:1px solid var(--border);
    border-left:3px solid var(--accent);border-radius:var(--radius);
    padding:18px 18px 0;margin-bottom:16px;position:relative}
  .card .num{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);
    display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:10px}
  .card h2{font-size:19px;font-weight:800;margin:0 0 6px;line-height:1.28}
  .card .desc{color:var(--ink-soft);font-size:14.5px;line-height:1.5;margin:0 0 2px}

  .cell{background:var(--surface2);margin:0 -18px;padding:11px 18px;border-top:1px solid var(--border)}
  .cell:last-child{border-radius:0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px)}
  .cell .label{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--ink-faint);
    text-transform:uppercase;margin-bottom:4px}
  .cell .body{font-size:14px;color:var(--ink-soft);line-height:1.45;white-space:pre-wrap}

  .rows{margin:0 -18px}
  .row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--border);
    cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;color:inherit}
  .row:active{background:rgba(255,255,255,.04)}
  .row.disabled{cursor:default;opacity:.5}
  .row .n{width:18px;flex:0 0 auto;font-weight:800;font-size:14px;color:var(--accent,var(--ink-faint))}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto}
  .row .t{flex:1;font-size:15px;font-weight:600;color:var(--ink);min-width:0}
  .row .t.placeholder{color:var(--ink-faint);font-weight:500}
  .row .meta{font-size:12.5px;color:var(--ink-faint);white-space:nowrap;flex:0 0 auto;max-width:38%;
    overflow:hidden;text-overflow:ellipsis}
  .row .chev{color:var(--ink-faint);font-size:15px;flex:0 0 auto}

  .rows.card-like{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin:0 0 4px;overflow:hidden}
  .rows.card-like .row:first-child{border-top:none}

  /* ---------- states ---------- */
  .state-block{padding:34px 10px;text-align:center;color:var(--ink-faint)}
  .state-block .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border-strong);
    border-top-color:var(--ink-soft);margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-block{padding:22px 4px;color:var(--ink-faint);font-size:14px;line-height:1.5}
  .empty-block b{display:block;color:var(--ink-soft);font-size:15px;font-weight:700;margin-bottom:4px}
  .error-block{padding:28px 10px;text-align:center}
  .error-block p{color:var(--ink-soft);margin:0 0 14px}
  .retrybtn{-webkit-appearance:none;appearance:none;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);padding:10px 20px;border-radius:12px;font-weight:700;
    font-size:14px;cursor:pointer}

  .setup{padding-top:10px}
  .setup h1{font-size:24px;margin:0 0 12px}
  .setup p{color:var(--ink-soft);line-height:1.6;font-size:14.5px}
  .setup ol{color:var(--ink-soft);line-height:1.9;font-size:14.5px;padding-left:20px}
  .setup code{background:var(--surface2);padding:2px 6px;border-radius:6px;font-size:13px}

  /* ---------- bottom nav ---------- */
  .bottomnav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:var(--maxw);
    display:flex;background:rgba(17,17,22,.92);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .navbtn{flex:1;-webkit-appearance:none;appearance:none;border:0;background:none;color:var(--ink-faint);
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-size:11px;
    font-weight:700;position:relative}
  .navbtn .ic{font-size:19px}
  .navbtn[aria-current="true"]{color:var(--ink)}
  .navbtn[aria-current="true"]::after{content:"";position:absolute;top:-2px;width:5px;height:5px;
    border-radius:50%;background:var(--self)}

  /* ---------- bottom sheets ---------- */
  #sheets{position:fixed;inset:0;z-index:200;display:none}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;background:var(--bg2);
    border:1px solid var(--border-strong);border-bottom:none;border-radius:20px 20px 0 0;
    max-height:84vh;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    transition:transform .18s ease, opacity .18s ease}
  .sheet-peek{height:16px;padding:0;pointer-events:none;box-shadow:none}
  .sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 10px}
  .sheet-head{display:flex;align-items:flex-start;gap:10px;padding-bottom:10px;margin-bottom:10px;
    border-bottom:1px solid var(--border)}
  .sheet-titles{flex:1;min-width:0}
  .sheet-title{font-size:17px;font-weight:800;line-height:1.3}
  .sheet-sub{font-size:13.5px;color:var(--ink-faint);margin-top:2px}
  .sheet-back,.sheet-close{-webkit-appearance:none;appearance:none;border:0;background:var(--surface2);
    color:var(--ink-soft);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;
    flex:0 0 auto;display:grid;place-items:center}
  .sheet-back.spacer{visibility:hidden}
  .sheet-body .desc{color:var(--ink-soft);font-size:14.5px;line-height:1.55;margin:0 0 12px}
  .drop-count{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-faint);margin:2px 0 8px}
  .facts{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  .fact{display:flex;justify-content:space-between;font-size:14px;padding:9px 12px;
    background:var(--surface2);border-radius:10px}
  .fact span{color:var(--ink-faint)}
  .fact b{font-weight:700}
  .notion-link{display:inline-block;margin-top:14px;font-size:13px;color:var(--ink-faint);
    text-decoration:underline;text-underline-offset:3px}
</style>

<div class="app">
  <header class="topbar">
    <span class="brand">🌊 Currents</span>
    <button class="iconbtn" id="refreshBtn" aria-label="Refresh" title="Refresh">⟳</button>
  </header>
  <main id="main"></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="sheets"></div>

<script>
(function(){
  "use strict";

  // Point this at your deployed currents/worker (see currents/README.md).
  // Until it's set, the app shows setup instructions instead of guessing.
  var WORKER_URL = "";

  var STEP_LABELS = ["Clarify your destination","Visualize the path","Feel the transformation","Follow your strategy","Be yourself"];
  var TABS = [
    { id:"currents", ic:"🌊", lb:"Currents" },
    { id:"circles", ic:"⭕", lb:"Circles" },
    { id:"drops", ic:"💧", lb:"Drops" }
  ];

  var state = { tab:"currents" };
  var sheetStack = [];

  var main, bottomnav, sheetsRoot;

  function esc(v){
    return String(v==null ? "" : v).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }
  function escAttr(v){ return esc(v).replace(/"/g,"&quot;"); }

  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso + (iso.length<=10 ? "T00:00:00" : ""));
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }

  function notionUrl(id){ return "https://www.notion.so/" + String(id).replace(/-/g,""); }

  function circleVar(circle){ return "var(--" + (circle || "kumara") + ")"; }

  async function fetchJSON(path){
    var res;
    try{
      res = await fetch(WORKER_URL + path);
    } catch(e){
      throw new Error("Couldn't reach the Currents Worker. Check your connection and WORKER_URL.");
    }
    if(!res.ok){
      var body = await res.json().catch(function(){ return {}; });
      throw new Error(body.error ? ("Worker error: " + body.error) : ("Request failed (" + res.status + ")"));
    }
    return res.json();
  }

  function loadingHTML(msg){
    return '<div class="state-block"><div class="spinner"></div>' + esc(msg || "Loading…") + "</div>";
  }
  function emptyHTML(title, sub){
    return '<div class="empty-block"><b>' + esc(title) + "</b>" + (sub ? esc(sub) : "") + "</div>";
  }
  function errorInline(e){
    return '<div class="error-block"><p>' + esc(e && e.message ? e.message : "Something went wrong.") + "</p></div>";
  }
  function errorHTML(tabId, e){
    return '<div class="screen error-block"><p>' + esc(e && e.message ? e.message : "Something went wrong.") +
      '</p><button class="retrybtn" data-action="retry" data-tab="' + tabId + '">Try again</button></div>';
  }

  // ---------- card component ----------
  function cardHTML(current, mode, badgeNumber){
    var accent = circleVar(current.circle);
    var rowsHTML;
    if(mode === "steps"){
      rowsHTML = STEP_LABELS.map(function(label, i){
        var n = i + 1;
        return '<div class="row" data-step="' + n + '" data-id="' + escAttr(current.id) +
          '" data-name="' + escAttr(current.name) + '"><span class="n">' + n + '</span><span class="t">' +
          esc(label) + '</span><span class="chev">›</span></div>';
      }).join("");
    } else {
      rowsHTML = [0,1,2,3,4].map(function(i){
        var c = (current.commitments || [])[i];
        if(!c){
          return '<div class="row disabled"><span class="n">' + (i+1) + '</span><span class="t placeholder">—</span></div>';
        }
        var meta = c.count > 0 ? (c.count + " current" + (c.count === 1 ? "" : "s")) : "empty";
        return '<div class="row" data-child="' + escAttr(c.id) + '" data-name="' + escAttr(c.name) +
          '"><span class="n">' + (i+1) + '</span><span class="t">' + esc(c.name) + '</span><span class="meta">' +
          esc(meta) + '</span><span class="chev">›</span></div>';
      }).join("");
    }
    return '<article class="card" style="--accent:' + accent + '">' +
      (badgeNumber != null ? '<span class="num">' + esc(badgeNumber) + "</span>" : "") +
      "<h2>" + esc(current.name || "Untitled") + "</h2>" +
      (current.description ? '<p class="desc">' + esc(current.description) + "</p>" : "") +
      '<div class="cell"><div class="label">Kumara</div><div class="body">' + (current.kumara ? esc(current.kumara) : "—") + "</div></div>" +
      '<div class="rows">' + rowsHTML + "</div>" +
      '<div class="cell"><div class="label">Aramuk</div><div class="body">' + (current.aramuk ? esc(current.aramuk) : "—") + "</div></div>" +
      "</article>";
  }

  // ---------- tabs ----------
  async function renderCurrentsTab(){
    main.innerHTML = loadingHTML("Loading your top currents…");
    try{
      var data = await fetchJSON("/api/currents");
      if(!data.currents.length){
        main.innerHTML = '<div class="screen"><div class="screen-head"><h1>Currents</h1></div>' +
          emptyHTML("No prioritized currents yet", "Set a Priority (1–10) on a Current in Notion to see it here.") + "</div>";
        return;
      }
      main.innerHTML = '<div class="screen"><div class="screen-head"><h1>Currents</h1><p class="sub">Your top ' +
        data.currents.length + ' by priority</p></div>' +
        data.currents.map(function(c, i){ return cardHTML(c, "steps", i + 1); }).join("") + "</div>";
    } catch(e){ main.innerHTML = errorHTML("currents", e); }
  }

  async function renderCirclesTab(){
    main.innerHTML = loadingHTML("Loading your circles…");
    try{
      var data = await fetchJSON("/api/circles");
      var html = '<div class="screen"><div class="screen-head"><h1>Circles</h1><p class="sub">The five areas of life</p></div>';
      data.circles.forEach(function(circle, idx){
        html += '<h3 class="circle-heading" style="--accent:var(--' + circle.key + ')">' + esc(circle.label) + "</h3>";
        if(!circle.masters.length){
          html += emptyHTML("No master current yet", "Give a Current this Circle and clear its Parent Current in Notion to feature it here.");
        } else {
          circle.masters.forEach(function(m){
            m.circle = circle.key; // the API groups by circle rather than stamping it on each master
            html += cardHTML(m, "commitments", idx + 1);
          });
        }
      });
      html += "</div>";
      main.innerHTML = html;
    } catch(e){ main.innerHTML = errorHTML("circles", e); }
  }

  function dropRowHTML(d){
    var meta = [];
    meta.push(d.currentName ? d.currentName : "Standalone");
    if(d.dueDate) meta.push(fmtDate(d.dueDate));
    if(d.repeats) meta.push(d.repeats);
    return '<div class="row" data-drop="' + escAttr(d.id) + '"><span class="t">' + esc(d.name || "Untitled") +
      '</span><span class="meta">' + esc(meta.join(" · ")) + '</span><span class="chev">›</span></div>';
  }

  async function renderDropsTab(){
    main.innerHTML = loadingHTML("Loading your drops…");
    try{
      var data = await fetchJSON("/api/drops");
      if(!data.drops.length){
        main.innerHTML = '<div class="screen"><div class="screen-head"><h1>Drops</h1></div>' +
          emptyHTML("No drops yet", "Add a Drop in Notion — link it to a Current, or leave it standalone.") + "</div>";
        return;
      }
      var groups = [1,2,3,4,5].map(function(n){ return { n:n, label:STEP_LABELS[n-1], items:[] }; });
      var noStep = { n:null, label:"No step set", items:[] };
      data.drops.forEach(function(d){ (d.step ? groups[d.step-1] : noStep).items.push(d); });
      var all = groups.concat(noStep.items.length ? [noStep] : []);
      var html = '<div class="screen"><div class="screen-head"><h1>Drops</h1><p class="sub">' +
        data.drops.length + " active</p></div>";
      all.forEach(function(g){
        if(!g.items.length) return;
        html += '<h3 class="group-heading">' + esc(g.label) + '</h3><div class="rows card-like">' +
          g.items.map(dropRowHTML).join("") + "</div>";
      });
      main.innerHTML = html;
    } catch(e){ main.innerHTML = errorHTML("drops", e); }
  }

  var TAB_RENDER = { currents:renderCurrentsTab, circles:renderCirclesTab, drops:renderDropsTab };

  function switchTab(tab){
    state.tab = tab;
    Array.prototype.forEach.call(bottomnav.querySelectorAll(".navbtn"), function(b){
      b.setAttribute("aria-current", String(b.getAttribute("data-tab") === tab));
    });
    TAB_RENDER[tab]();
  }

  // ---------- sheets (stacked bottom sheets, for recursive current drill-down) ----------
  function sheetShell(title, subtitle, bodyHTML, opts){
    opts = opts || {};
    var back = opts.showBack ? '<button class="sheet-back" data-action="back">‹</button>' : '<span class="sheet-back spacer">‹</span>';
    var link = opts.notionId ? '<a class="notion-link" href="' + notionUrl(opts.notionId) + '" target="_blank" rel="noopener">Open in Notion ↗</a>' : "";
    return '<div class="sheet-grab"></div><div class="sheet-head">' + back +
      '<div class="sheet-titles"><div class="sheet-title">' + title + "</div>" +
      (subtitle ? '<div class="sheet-sub">' + subtitle + "</div>" : "") + "</div>" +
      '<button class="sheet-close" data-action="close">✕</button></div>' +
      '<div class="sheet-body">' + bodyHTML + link + "</div>";
  }

  function renderSheets(){
    if(!sheetStack.length){ sheetsRoot.innerHTML = ""; sheetsRoot.style.display = "none"; return; }
    sheetsRoot.style.display = "block";
    var n = sheetStack.length;
    var html = '<div class="backdrop" id="backdrop"></div>';
    // Only the top sheet gets real content (and its close/back button). Lower
    // sheets in the stack are a purely decorative peek so a shorter top sheet
    // can never leave a taller lower sheet's header sticking out above it.
    for(var i = 0; i < n; i++){
      if(i === n - 1){
        html += '<div class="sheet">' + sheetStack[i].html + "</div>";
      } else {
        html += '<div class="sheet sheet-peek" style="bottom:' + ((n - 1 - i) * 10) + 'px"></div>';
      }
    }
    sheetsRoot.innerHTML = html;
    document.getElementById("backdrop").onclick = closeSheets;
  }
  function pushSheet(html){ sheetStack.push({ html:html }); renderSheets(); }
  function replaceTopSheet(html){ if(sheetStack.length){ sheetStack[sheetStack.length-1].html = html; renderSheets(); } }
  function popSheet(){ sheetStack.pop(); renderSheets(); }
  function closeSheets(){ sheetStack = []; renderSheets(); }

  async function openStepSheet(id, name, step){
    var label = STEP_LABELS[step-1];
    pushSheet(sheetShell(esc(name), esc(label), loadingHTML("Loading…"), { showBack:true }));
    try{
      var data = await fetchJSON("/api/step?id=" + encodeURIComponent(id) + "&step=" + step);
      var body = "";
      if(step === 1 && data.myGoal){
        body += '<div class="cell"><div class="label">My Goal</div><div class="body">' + esc(data.myGoal) + "</div></div>";
      }
      body += '<div class="drop-count">' + data.drops.length + " drop" + (data.drops.length === 1 ? "" : "s") + "</div>";
      if(data.drops.length){
        body += '<div class="rows">' + data.drops.map(function(d){
          return '<div class="row" data-drop="' + escAttr(d.id) + '"><span class="t">' + esc(d.name || "Untitled") + '</span><span class="chev">›</span></div>';
        }).join("") + "</div>";
      } else {
        body += emptyHTML("No drops yet", "Add a Drop in Notion, set its Step, and link it to this Current.");
      }
      replaceTopSheet(sheetShell(esc(data.currentName || name), esc(label), body, { showBack:true, notionId:id }));
    } catch(e){
      replaceTopSheet(sheetShell(esc(name), esc(label), errorInline(e), { showBack:true }));
    }
  }

  async function openChildrenSheet(id, name){
    pushSheet(sheetShell(esc(name || "…"), "", loadingHTML("Loading…"), { showBack:true }));
    try{
      var data = await fetchJSON("/api/children?id=" + encodeURIComponent(id));
      var body = data.description ? '<p class="desc">' + esc(data.description) + "</p>" : "";
      if(data.children.length){
        body += '<div class="rows">' + data.children.map(function(c){
          return '<div class="row" data-child="' + escAttr(c.id) + '" data-name="' + escAttr(c.name) +
            '"><span class="dot"></span><span class="t">' + esc(c.name) + '</span><span class="chev">›</span></div>';
        }).join("") + "</div>";
      } else {
        body += emptyHTML("No related currents yet", "");
      }
      replaceTopSheet(sheetShell(esc(data.name), "", body, { showBack:true, notionId:data.id }));
    } catch(e){
      replaceTopSheet(sheetShell(esc(name || ""), "", errorInline(e), { showBack:true }));
    }
  }

  async function openDropSheet(id){
    pushSheet(sheetShell("Drop", "", loadingHTML("Loading…"), { showBack:true }));
    try{
      var data = await fetchJSON("/api/drop?id=" + encodeURIComponent(id));
      var d = data.drop;
      var body = d.description ? '<p class="desc">' + esc(d.description) + "</p>" : "";
      var facts = [];
      if(d.dueDate) facts.push(["Due", fmtDate(d.dueDate)]);
      if(d.completed) facts.push(["Completed", fmtDate(d.completed)]);
      if(d.repeats) facts.push(["Repeats", esc(d.repeats)]);
      if(facts.length){
        body += '<div class="facts">' + facts.map(function(f){
          return '<div class="fact"><span>' + esc(f[0]) + "</span><b>" + f[1] + "</b></div>";
        }).join("") + "</div>";
      }
      var links = [];
      if(d.design) links.push(["Design", d.design]);
      if(d.moodboard) links.push(["Moodboard", d.moodboard]);
      if(d.wireframe) links.push(["UX Wireframe", d.wireframe]);
      if(links.length){
        body += '<div class="rows">' + links.map(function(l){
          return '<a class="row" href="' + escAttr(l[1]) + '" target="_blank" rel="noopener"><span class="t">' + esc(l[0]) + '</span><span class="chev">↗</span></a>';
        }).join("") + "</div>";
      }
      replaceTopSheet(sheetShell(esc(d.name || "Untitled"), "", body, { showBack:true, notionId:d.id }));
    } catch(e){
      replaceTopSheet(sheetShell("Drop", "", errorInline(e), { showBack:true }));
    }
  }

  // ---------- setup notice (no WORKER_URL configured yet) ----------
  function renderSetupNotice(){
    bottomnav.style.display = "none";
    main.innerHTML = '<div class="screen setup">' +
      "<h1>Connect Currents to Notion</h1>" +
      "<p>This app reads your Currents and Drops live from Notion, through a small Cloudflare Worker that holds your integration token securely (a static page can't hold a secret).</p>" +
      "<ol>" +
      "<li>Deploy <code>currents/worker/worker.js</code> to Cloudflare Workers.</li>" +
      "<li>Add your Notion integration token as the <code>NOTION_TOKEN</code> secret.</li>" +
      "<li>Share your Currents and Drops databases with that integration in Notion.</li>" +
      "<li>Paste the deployed Worker URL into <code>WORKER_URL</code> near the top of the script in <code>index.html</code>.</li>" +
      "</ol>" +
      "<p>See <code>currents/README.md</code> for the full walkthrough.</p>" +
      "</div>";
  }

  // ---------- wiring ----------
  function handleMainClick(e){
    var retryBtn = e.target.closest("[data-action='retry']");
    if(retryBtn){ TAB_RENDER[retryBtn.getAttribute("data-tab")](); return; }
    var stepRow = e.target.closest(".row[data-step]");
    if(stepRow){ openStepSheet(stepRow.getAttribute("data-id"), stepRow.getAttribute("data-name"), parseInt(stepRow.getAttribute("data-step"), 10)); return; }
    var childRow = e.target.closest(".row[data-child]");
    if(childRow){ openChildrenSheet(childRow.getAttribute("data-child"), childRow.getAttribute("data-name")); return; }
    var dropRow = e.target.closest(".row[data-drop]");
    if(dropRow){ openDropSheet(dropRow.getAttribute("data-drop")); return; }
  }

  function handleSheetsClick(e){
    if(e.target.closest("[data-action='close']")){ closeSheets(); return; }
    if(e.target.closest("[data-action='back']")){ popSheet(); return; }
    var dropRow = e.target.closest(".row[data-drop]");
    if(dropRow){ openDropSheet(dropRow.getAttribute("data-drop")); return; }
    var childRow = e.target.closest(".row[data-child]");
    if(childRow){ openChildrenSheet(childRow.getAttribute("data-child"), childRow.getAttribute("data-name")); return; }
  }

  function init(){
    main = document.getElementById("main");
    bottomnav = document.getElementById("bottomnav");
    sheetsRoot = document.getElementById("sheets");

    bottomnav.innerHTML = TABS.map(function(t){
      return '<button class="navbtn" data-tab="' + t.id + '" aria-current="' + (state.tab === t.id) + '">' +
        '<span class="ic">' + t.ic + '</span><span class="lb">' + t.lb + "</span></button>";
    }).join("");
    Array.prototype.forEach.call(bottomnav.querySelectorAll(".navbtn"), function(b){
      b.onclick = function(){ switchTab(b.getAttribute("data-tab")); };
    });

    main.addEventListener("click", handleMainClick);
    sheetsRoot.addEventListener("click", handleSheetsClick);
    document.getElementById("refreshBtn").onclick = function(){ TAB_RENDER[state.tab](); };

    if(!WORKER_URL){ renderSetupNotice(); return; }
    switchTab("currents");
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
