# Cloudflare Worker config for the SCALE AI reflection endpoint.
# Deploy with: npx wrangler deploy   (after `npx wrangler secret put ANTHROPIC_API_KEY`)
# Or paste worker.js into a Worker in the Cloudflare dashboard and add the
# ANTHROPIC_API_KEY secret there — no CLI needed.

name = "scale-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# Optional: lock CORS to your site instead of allowing any origin.
# [vars]
# ALLOWED_ORIGIN = "https://elliottsamuel.github.io"

# ANTHROPIC_API_KEY is a secret — never put it here. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# or via the dashboard: Settings → Variables and Secrets → Add (type: Secret).
