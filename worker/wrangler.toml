# Cloudflare Worker config for the SCALE AI reflection endpoint.
# Uses Cloudflare Workers AI (built-in models) — no API key, no credit card.
#
# Deploy with the CLI:   cd worker && npx wrangler deploy
# Or paste worker.js into a Worker in the Cloudflare dashboard and add a
# Workers AI binding named `AI` there (Settings -> Bindings -> Add -> Workers AI).

name = "scale-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# Workers AI binding — exposes env.AI to the Worker. Required.
[ai]
binding = "AI"

# Optional: lock CORS to your site instead of allowing any origin.
# [vars]
# ALLOWED_ORIGIN = "https://elliottsamuel.github.io"
