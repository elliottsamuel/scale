<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SCALE — a simple five-step framework for solving your business's most difficult problems. Step 1: See Your Destination.">
<meta name="theme-color" content="#05060F">
<title>SCALE</title>
</head>
<body>
<style>
  :root{
    --void:#05060F;
    --bg-0:#070A18;
    --panel:rgba(19,25,52,.72);
    --panel-2:rgba(14,19,42,.6);
    --line:rgba(150,166,224,.16);
    --line-strong:rgba(150,166,224,.30);
    --ink:#EEF0FF;
    --muted:#AAB2DA;
    --faint:#727AA6;
    --accent:#8AA0FF;
    --accent-2:#B79CFF;
    --accent-soft:rgba(138,160,255,.14);
    --accent-ink:#070A18;
    --a:#8FA8DE;
    --a-soft:rgba(143,168,222,.14);
    --b:#F5C87A;
    --b-soft:rgba(245,200,122,.15);
    --radius:16px;
    --glow:0 0 44px rgba(138,160,255,.28);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }

  *{box-sizing:border-box}
  html,body{background:var(--void)}
  body{margin:0}

  #stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}

  .wrap{
    position:relative;z-index:1;min-height:100vh;
    color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 20px 72px;
    background:
      radial-gradient(1200px 720px at 50% -12%, rgba(124,140,255,.16), transparent 60%),
      radial-gradient(1000px 620px at 88% 8%, rgba(183,156,255,.12), transparent 55%),
      radial-gradient(820px 560px at 6% 88%, rgba(96,200,224,.09), transparent 55%);
  }
  .wrap.centered{justify-content:center;padding-top:20px;padding-bottom:20px}
  .shell{width:100%;max-width:720px;flex:1;display:flex;flex-direction:column;gap:22px}
  .wrap.centered .shell{flex:1;justify-content:center}

  /* ---------- header ---------- */
  header#hdr{display:flex;flex-direction:column;gap:14px}
  header#hdr:empty{display:none}
  .hdr-top{display:flex;align-items:center;gap:12px}
  .wm-sm{font-family:var(--font-display);font-size:17px;letter-spacing:.30em;color:var(--ink);
    background:none;border:0;padding:0;cursor:pointer;text-indent:.30em}
  .wm-sm:hover{color:var(--accent)}
  .hdr-spacer{flex:1}
  .hdr-tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

  .letters{display:flex;gap:8px}
  .letter{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px 9px;
    border-radius:12px;border:1px solid var(--line);background:var(--panel-2)}
  .letter b{font-family:var(--font-display);font-size:21px;font-weight:600;color:var(--faint);line-height:1}
  .letter small{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .letter.is-active{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow)}
  .letter.is-active b{color:var(--accent);text-shadow:0 0 18px rgba(138,160,255,.6)}
  .letter.is-active small{color:var(--accent)}

  /* ---------- card ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 34px 30px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 24px 60px -28px rgba(0,0,0,.8)}
  @media (max-width:520px){.card{padding:26px 22px 24px}}

  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
  .eyebrow--muted{color:var(--faint)}
  h1{font-family:var(--font-display);font-weight:600;font-size:clamp(27px,5.2vw,38px);line-height:1.1;letter-spacing:-.005em;margin:0 0 14px;text-wrap:balance}
  h2{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,4.2vw,29px);line-height:1.14;margin:0 0 12px;text-wrap:balance}
  .lede{font-size:17px;color:var(--muted);margin:0 0 20px;max-width:56ch}
  p.body{font-size:15.5px;color:var(--muted);margin:0 0 16px;max-width:60ch}
  .q-help{font-size:14.5px;color:var(--muted);margin:2px 0 18px;max-width:58ch}

  /* ---------- splash ---------- */
  .splash{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:24px 8px}
  .starmark{width:34px;height:34px;margin-bottom:26px;opacity:0;animation:markIn 1s ease .1s forwards}
  .wordmark{display:flex;justify-content:center;gap:.02em;margin:0;font-family:var(--font-display);
    font-weight:600;font-size:clamp(52px,15vw,108px);letter-spacing:.16em;line-height:1;
    color:var(--ink);text-indent:.16em}
  .wordmark span{display:inline-block;opacity:0;transform:translateY(14px);
    text-shadow:0 0 32px rgba(138,160,255,.45),0 0 66px rgba(138,160,255,.22);
    animation:letterIn .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.35s + var(--i) * .1s)}
  .tagline{max-width:33ch;margin:34px 0 0;font-size:clamp(16px,2.4vw,19px);line-height:1.55;color:var(--muted);
    opacity:0;animation:fadeUp 1s ease .95s forwards}
  .splash .cta{margin-top:40px;opacity:0;animation:fadeUp 1s ease 1.2s forwards}

  @keyframes letterIn{to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes markIn{to{opacity:1}}

  /* ---------- callout ---------- */
  .callout{display:flex;gap:13px;background:var(--panel-2);border:1px solid var(--line);
    border-left:3px solid var(--b);border-radius:12px;padding:14px 16px;margin:4px 0 22px}
  .callout .mark{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--b);white-space:nowrap;padding-top:2px}
  .callout p{margin:0;font-size:14.5px;color:var(--muted)}
  .callout p b{color:var(--ink);font-weight:600}

  /* ---------- use-case choices ---------- */
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 8px}
  @media (max-width:520px){.choices{grid-template-columns:1fr}}
  .choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:16px;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s,background .15s,transform .05s,box-shadow .15s}
  .choice:hover{border-color:var(--accent);box-shadow:var(--glow)}
  .choice:active{transform:translateY(1px)}
  .choice.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow)}
  .choice .t{font-weight:600;font-size:15px;margin-bottom:3px;color:var(--ink)}
  .choice .s{font-size:13.5px;color:var(--muted);line-height:1.4}

  /* ---------- inputs ---------- */
  textarea,input[type=text]{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;resize:vertical;line-height:1.5}
  textarea{min-height:130px}
  textarea::placeholder,input::placeholder{color:var(--faint)}
  textarea:focus,input:focus{outline:none;border-color:var(--accent);background:rgba(20,27,54,.9);
    box-shadow:0 0 0 3px rgba(138,160,255,.22)}
  .field-note{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--faint);margin-top:9px}

  /* ---------- nav ---------- */
  .foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px}
  .subprog{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--faint)}
  .nav{display:flex;gap:10px;margin-left:auto}
  .btn{font-family:inherit;font-size:14.5px;font-weight:600;border-radius:11px;padding:11px 20px;cursor:pointer;
    border:1px solid transparent;transition:filter .15s,border-color .15s,transform .05s,box-shadow .15s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn--primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:var(--glow)}
  .btn--primary:hover{filter:brightness(1.08)}
  .btn--ghost{background:transparent;color:var(--muted);border-color:var(--line-strong)}
  .btn--ghost:hover{border-color:var(--accent);color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn--stellar{font-size:16px;padding:15px 40px;border-radius:999px;letter-spacing:.03em;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
    box-shadow:0 0 50px rgba(138,160,255,.4),0 10px 30px -10px rgba(0,0,0,.6)}
  .btn--stellar:hover{filter:brightness(1.08);transform:translateY(-1px)}

  /* ---------- tags / summary map ---------- */
  .tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;display:inline-block}
  .tag--a{background:var(--a-soft);color:var(--a)}
  .tag--b{background:var(--b-soft);color:var(--b)}
  .journeys{display:flex;flex-direction:column;gap:16px;margin:8px 0 24px}
  .journey{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:16px 16px 18px}
  .journey__who{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .path{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:8px}
  @media (max-width:520px){.path{grid-template-columns:1fr;gap:10px}}
  .node{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
  .node--a{border-top:2px solid var(--a)}
  .node--b{border-top:2px solid var(--b);box-shadow:0 0 30px -8px rgba(245,200,122,.4)}
  .node p{margin:0;font-size:14px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
  .node .empty{color:var(--faint);font-style:italic}
  .arrow{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:20px}
  @media (max-width:520px){.arrow{transform:rotate(90deg)}}
  .next-teaser{display:flex;align-items:center;gap:14px;border:1px dashed var(--line-strong);border-radius:12px;padding:15px 16px}
  .next-teaser .k{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--faint)}
  .next-teaser .txt{font-size:14px;color:var(--muted)}
  .next-teaser .soon{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--void);font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade{animation:fade .34s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .fade,.starmark,.wordmark span,.tagline,.splash .cta{animation:none;opacity:1;transform:none}
    .toast{transition:opacity .2s}
  }
</style>

<canvas id="stars"></canvas>
<div class="wrap" id="wrap">
  <div class="shell">
    <header id="hdr"></header>
    <main id="root"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STEPS = [
    {k:"S", live:true},{k:"C", live:false},{k:"A", live:false},{k:"L", live:false},{k:"E", live:false}
  ];

  var USE_CASES = {
    product:{title:"Create a product or feature",desc:"Design a product experience or a new feature.",
      challengeQ:"What do you want to create?",
      challengePh:"e.g. A mobile onboarding flow that gets new users set up in under two minutes.",
      audNoun:"your user",audIdQ:"Who is this for? Bring one real user or a single archetype to mind.",
      audIdPh:"e.g. A busy first-time user opening the app on their phone.",
      audAQ:"Where is your user now — before they’ve used this?",
      audAPh:"e.g. Confused about how to start; likely to give up before seeing any value.",
      audBQ:"Where do you want your user to end up?",
      audBPh:"e.g. Set up, confident, and already feeling the core value."},
    article:{title:"Write an article or content",desc:"Write an article, essay, or other piece.",
      challengeQ:"What do you want to write?",
      challengePh:"e.g. An essay on why naming what you actually want is the hardest first step.",
      audNoun:"your reader",audIdQ:"Who are you writing for? Bring one reader or a single archetype to mind.",
      audIdPh:"e.g. A thoughtful founder who feels stuck and can’t name what they want.",
      audAQ:"Where is your reader now — before they’ve read this?",
      audAPh:"e.g. Vaguely dissatisfied, spinning, without language for the problem.",
      audBQ:"Where do you want your reader to end up after reading?",
      audBPh:"e.g. Clear, a little relieved, with one concrete thing to do next."},
    conflict:{title:"Resolve a conflict or relationship",desc:"Work through a conflict or strengthen a relationship.",
      challengeQ:"What situation do you want to work through?",
      challengePh:"e.g. A recurring tension with a co-founder about how decisions get made.",
      audNoun:"the other person",audIdQ:"Who is the other person? Bring them clearly to mind.",
      audIdPh:"e.g. My co-founder, who feels shut out of decisions.",
      audAQ:"Where is the other person now in this situation?",
      audAPh:"e.g. Frustrated, guarded, expecting not to be heard.",
      audBQ:"Where do you want the other person to end up — a place they’d want too?",
      audBPh:"e.g. Feeling respected and genuinely part of how we decide things."},
    problem:{title:"Solve a problem",desc:"Work through a problem or a decision.",
      challengeQ:"What problem do you want to solve?",
      challengePh:"e.g. Whether to change our pricing model this quarter.",
      audNoun:"the person on the other end",audIdQ:"Who else is affected by this? Bring one person or archetype to mind.",
      audIdPh:"e.g. A long-time customer on our current plan.",
      audAQ:"Where is that person now in relation to this?",
      audAPh:"e.g. Happy with today’s price; wary of any change.",
      audBQ:"Where do you want them to end up?",
      audBPh:"e.g. Feeling the new plan is fair and clearly worth it."},
    learn:{title:"Learn how SCALE works",desc:"Get a feel for the framework using something real.",handHold:true,
      challengeQ:"Bring any challenge or goal you’re navigating right now to mind. What is it?",
      challengePh:"Anything alive for you — a project, a decision, a goal. Just pick one.",
      audNoun:"the other person",audIdQ:"Almost anything meaningful involves someone else. Who’s the other person here?",
      audIdPh:"e.g. Someone this affects, or someone you’re doing it for.",
      audAQ:"Where is that person now?",audAPh:"Describe where they’re starting from.",
      audBQ:"Where would you want that person to end up — somewhere they’d want too?",
      audBPh:"Describe the shared destination."},
    other:{title:"Something else",desc:"Bring your own use case.",
      challengeQ:"What do you want to use this SCALE session for?",
      challengePh:"Describe it in a sentence or two.",
      audNoun:"the other person",audIdQ:"Who’s on the other end of this? Bring one person or archetype to mind.",
      audIdPh:"Describe who they are.",
      audAQ:"Where is that person now?",audAPh:"Describe where they’re starting from.",
      audBQ:"Where do you want that person to end up?",audBPh:"Describe the destination."}
  };

  var SCREENS = ["splash","usecase","intro","challenge","myA","myB","audId","audA","audB","summary"];
  var DEFINE = ["challenge","myA","myB","audId","audA","audB"];
  var LS_KEY = "scale_v2";

  var state = {i:0, a:{useCase:"", challenge:"", myA:"", myB:"", audName:"", audA:"", audB:""}};
  load();

  var root = document.getElementById("root");
  var hdr = document.getElementById("hdr");
  var wrap = document.getElementById("wrap");
  var toastEl = document.getElementById("toast");

  function load(){ try{ var s=JSON.parse(localStorage.getItem(LS_KEY)); if(s&&s.a){state=s;} }catch(e){} }
  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function uc(){ return USE_CASES[state.a.useCase] || USE_CASES.other; }
  function audLabel(){ return state.a.audName ? esc(state.a.audName) : ("Your " + esc(uc().audNoun).replace(/^your\s+/i,"")); }
  function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); setTimeout(function(){toastEl.classList.remove("show");},1800); }

  function go(name){ state.i=SCREENS.indexOf(name); save(); render(); scrollUp(); }
  function next(){ if(state.i<SCREENS.length-1){ state.i++; save(); render(); scrollUp(); } }
  function back(){ if(state.i>0){ state.i--; save(); render(); scrollUp(); } }
  function scrollUp(){ window.scrollTo({top:0,behavior:"smooth"}); }

  function renderHeader(name){
    if(name==="splash"){ hdr.innerHTML=""; return; }
    var showRail = SCREENS.indexOf(name) >= SCREENS.indexOf("intro");
    var rail = "";
    if(showRail){
      rail = '<div class="letters">' + STEPS.map(function(s){
        var active = s.k==="S";
        return '<div class="letter'+(active?' is-active':'')+'"><b>'+s.k+'</b><small>'+(active?'Step 1':'Soon')+'</small></div>';
      }).join("") + '</div>';
    }
    hdr.innerHTML =
      '<div class="hdr-top">'
      + '<button class="wm-sm" id="wmBtn" type="button" aria-label="Back to start">SCALE</button>'
      + '<span class="hdr-spacer"></span>'
      + '<span class="hdr-tag">'+(showRail?'Step 1 · See Your Destination':'Getting started')+'</span>'
      + '</div>' + rail;
    var wm = document.getElementById("wmBtn"); if(wm) wm.addEventListener("click", function(){ go("splash"); });
  }

  function footer(o){
    var sub = o.subLabel ? '<span class="subprog">'+o.subLabel+'</span>' : '';
    var b = o.showBack ? '<button class="btn btn--ghost" id="backBtn" type="button">Back</button>' : '';
    var p = o.primaryLabel ? '<button class="btn btn--primary" id="primaryBtn" type="button"'+(o.disabled?' disabled':'')+'>'+o.primaryLabel+'</button>' : '';
    return '<div class="foot">'+sub+'<div class="nav">'+b+p+'</div></div>';
  }
  function wireFooter(onPrimary){
    var b=document.getElementById("backBtn"); if(b) b.addEventListener("click", back);
    var p=document.getElementById("primaryBtn"); if(p) p.addEventListener("click", onPrimary);
  }

  function inputScreen(cfg){
    var val = state.a[cfg.field] || "";
    root.innerHTML = '<div class="card fade">'
      + '<p class="eyebrow">'+cfg.eyebrow+'</p>'
      + '<h2>'+cfg.question+'</h2>'
      + (cfg.help?'<p class="q-help">'+cfg.help+'</p>':'')
      + '<textarea id="ta" placeholder="'+esc(cfg.placeholder)+'">'+esc(val)+'</textarea>'
      + (cfg.note?'<p class="field-note">'+cfg.note+'</p>':'')
      + footer({showBack:true, primaryLabel:"Continue", subLabel:"Step 1 · "+cfg.stepIdx+" of "+DEFINE.length})
      + '</div>';
    var ta=document.getElementById("ta");
    ta.addEventListener("input", function(){ state.a[cfg.field]=ta.value; save(); });
    wireFooter(next);
  }

  function render(){
    var name = SCREENS[state.i];
    var u = uc();
    wrap.classList.toggle("centered", name==="splash");
    renderHeader(name);

    if(name==="splash"){
      root.innerHTML =
        '<div class="splash">'
        + '<svg class="starmark" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
          + '<path d="M12 0 L13.6 10.4 L24 12 L13.6 13.6 L12 24 L10.4 13.6 L0 12 L10.4 10.4 Z" fill="#8AA0FF"/>'
        + '</svg>'
        + '<h1 class="wordmark">'
          + '<span style="--i:0">S</span><span style="--i:1">C</span><span style="--i:2">A</span><span style="--i:3">L</span><span style="--i:4">E</span>'
        + '</h1>'
        + '<p class="tagline">A simple five-step framework for solving your business’s most difficult problems.</p>'
        + '<div class="cta"><button class="btn btn--stellar" id="tryBtn" type="button">Try SCALE</button></div>'
        + '</div>';
      document.getElementById("tryBtn").addEventListener("click", function(){ go("usecase"); });
    }

    else if(name==="usecase"){
      var keys=["product","article","conflict","problem","learn","other"];
      var cards=keys.map(function(k){
        var c=USE_CASES[k], sel=state.a.useCase===k?" sel":"";
        return '<button class="choice'+sel+'" type="button" data-k="'+k+'"><div class="t">'+c.title+'</div><div class="s">'+c.desc+'</div></button>';
      }).join("");
      root.innerHTML = '<div class="card fade">'
        + '<p class="eyebrow eyebrow--muted">Choose your focus</p>'
        + '<h2>What would you like to use SCALE for?</h2>'
        + '<p class="q-help">Pick the closest fit. It tailors the questions ahead — you can change it later.</p>'
        + '<div class="choices">'+cards+'</div>'
        + footer({showBack:true, primaryLabel:"Continue", disabled:!state.a.useCase})
        + '</div>';
      Array.prototype.forEach.call(document.querySelectorAll(".choice"), function(btn){
        btn.addEventListener("click", function(){ state.a.useCase=btn.getAttribute("data-k"); save(); render(); });
      });
      wireFooter(next);
    }

    else if(name==="intro"){
      root.innerHTML = '<div class="card fade">'
        + '<p class="eyebrow">Step 1 · S</p>'
        + '<h1>See Your Destination</h1>'
        + '<p class="lede">This whole process is about movement — getting you from where you are to where you want to be. So before anything else, we get clear on the destination.</p>'
        + '<p class="body">Most people never actually name what they want. That clarity is the first real step toward any meaningful goal — and it’s the entire job of this step.</p>'
        + '<div class="callout"><span class="mark">Set aside</span><p>If problems, doubts, or obstacles come to mind, good — notice them and <b>set them aside for now</b>. We deal with those in Step&nbsp;2. Right now we only define where you want to go.</p></div>'
        + footer({showBack:true, primaryLabel:"Start Step 1"})
        + '</div>';
      wireFooter(next);
    }

    else if(name==="challenge"){
      inputScreen({field:"challenge",stepIdx:1,eyebrow:"Step 1 · The challenge",question:u.challengeQ,
        help:u.handHold?"There’s no wrong answer here. Pick one thing and describe it in a sentence or two.":"Describe it at a high level — a sentence or two is plenty.",
        placeholder:u.challengePh});
    }
    else if(name==="myA"){
      inputScreen({field:"myA",stepIdx:2,eyebrow:"Step 1 · My A · where you are now",question:"Where are you now with this?",
        help:"Capture your full current position — what you’ve done so far, what you have, and how you feel about it. Don’t filter it.",
        placeholder:"Everything about where you stand right now…",note:"A = your starting point."});
    }
    else if(name==="myB"){
      inputScreen({field:"myB",stepIdx:3,eyebrow:"Step 1 · My B · where you want to be",question:"Where do you want to end up?",
        help:"Describe the outcome you want — your destination, as vividly as you can. Stay with what you want, not how you’ll get there.",
        placeholder:"The destination you’re moving toward…",note:"B = your destination."});
    }
    else if(name==="audId"){
      inputScreen({field:"audName",stepIdx:4,eyebrow:"Step 1 · Your audience",question:u.audIdQ,
        help:"There’s always someone on the other end. For now, bring just one person or a single archetype to mind — you can run SCALE again later for others.",
        placeholder:u.audIdPh,note:"One person for now."});
    }
    else if(name==="audA"){
      inputScreen({field:"audA",stepIdx:5,eyebrow:"Step 1 · Audience A · where they are now",question:u.audAQ,
        help:"Step into their shoes. Where do they genuinely stand right now, before anything changes?",
        placeholder:u.audAPh,note:"Their starting point."});
    }
    else if(name==="audB"){
      inputScreen({field:"audB",stepIdx:6,eyebrow:"Step 1 · Audience B · where they want to be",question:u.audBQ,
        help:"This is one shared destination: the place you want them to reach that they’d want too. That alignment is what actually helps them get there.",
        placeholder:u.audBPh,note:"Their destination — aligned with yours."});
    }

    else if(name==="summary"){
      function cell(v){ return v ? esc(v) : '<span class="empty">Not yet defined</span>'; }
      root.innerHTML = '<div class="card fade">'
        + '<p class="eyebrow">Step 1 complete</p>'
        + '<h1>Your destination is clear.</h1>'
        + '<p class="lede">You just did the thing most people skip: you named where you are and where you want to go — for yourself and for the person on the other end. That clarity is the foundation everything else builds on.</p>'
        + '<div class="journeys">'
          + '<div class="journey"><div class="journey__who">You</div><div class="path">'
            + '<div class="node node--a"><span class="tag tag--a">Now · A</span><p>'+cell(state.a.myA)+'</p></div>'
            + '<div class="arrow">→</div>'
            + '<div class="node node--b"><span class="tag tag--b">Destination · B</span><p>'+cell(state.a.myB)+'</p></div>'
          + '</div></div>'
          + '<div class="journey"><div class="journey__who">'+audLabel()+'</div><div class="path">'
            + '<div class="node node--a"><span class="tag tag--a">Now · A</span><p>'+cell(state.a.audA)+'</p></div>'
            + '<div class="arrow">→</div>'
            + '<div class="node node--b"><span class="tag tag--b">Destination · B</span><p>'+cell(state.a.audB)+'</p></div>'
          + '</div></div>'
        + '</div>'
        + '<div class="next-teaser"><span class="k">C</span><span class="txt">Next: <b>Step&nbsp;2</b>. Remember those problems and barriers you set aside? That’s exactly what Step&nbsp;2 is for.</span><span class="soon">Coming soon</span></div>'
        + '<div class="foot"><div class="nav"><button class="btn btn--ghost" id="resetBtn" type="button">Start over</button><button class="btn btn--ghost" id="backBtn" type="button">Back</button><button class="btn btn--primary" id="copyBtn" type="button">Copy summary</button></div></div>'
        + '</div>';
      document.getElementById("backBtn").addEventListener("click", back);
      document.getElementById("resetBtn").addEventListener("click", function(){
        state={i:0,a:{useCase:"",challenge:"",myA:"",myB:"",audName:"",audA:"",audB:""}}; save(); render(); scrollUp();
      });
      document.getElementById("copyBtn").addEventListener("click", function(){
        var txt=summaryText();
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){toast("Summary copied");},function(){toast("Copy failed — select manually");});
        } else { toast("Copy not available here"); }
      });
    }
  }

  function summaryText(){
    var u=uc();
    return "SCALE — Step 1: See Your Destination\n"
      + "Use case: "+u.title+"\n"
      + (state.a.challenge?"Challenge: "+state.a.challenge+"\n":"")
      + "\nYOU\n  Now (A): "+(state.a.myA||"—")+"\n  Destination (B): "+(state.a.myB||"—")+"\n"
      + "\n"+(state.a.audName||"AUDIENCE").toUpperCase()+"\n  Now (A): "+(state.a.audA||"—")+"\n  Destination (B): "+(state.a.audB||"—")+"\n";
  }

  /* ---------- starfield ---------- */
  (function starfield(){
    var canvas=document.getElementById("stars"), ctx=canvas.getContext("2d");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var stars=[], w=0, h=0, dpr=Math.min(window.devicePixelRatio||1, 2), t=0;
    function resize(){
      w=window.innerWidth; h=window.innerHeight;
      canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      var count=Math.round(Math.min(220, (w*h)/9000));
      stars=[];
      for(var i=0;i<count;i++){
        var warm=Math.random()<0.12;
        stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+0.3,
          a:Math.random()*0.5+0.25,tw:Math.random()*0.02+0.004,ph:Math.random()*6.28,
          drift:Math.random()*0.04+0.01,warm:warm});
      }
    }
    function draw(){
      ctx.clearRect(0,0,w,h);
      for(var i=0;i<stars.length;i++){
        var s=stars[i];
        var alpha = reduce ? s.a : s.a*(0.55+0.45*Math.sin(t*s.tw*60+s.ph));
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,6.2832);
        ctx.fillStyle = s.warm ? "rgba(245,205,140,"+alpha+")" : "rgba(214,224,255,"+alpha+")";
        ctx.fill();
        if(!reduce){ s.y-=s.drift; if(s.y< -2){ s.y=h+2; s.x=Math.random()*w; } }
      }
    }
    function loop(){ t+=0.016; draw(); requestAnimationFrame(loop); }
    resize(); window.addEventListener("resize", resize);
    if(reduce){ draw(); } else { loop(); }
  })();

  render();
})();
</script>
</body>
